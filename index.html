<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELUS Partner Interlock Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for browser-side JSX -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        .telus-purple { color: #4B286D; }
        .bg-telus-purple { background-color: #4B286D; }
        .telus-green { color: #2B8000; }
        .bg-telus-green { background-color: #2B8000; }
        .bg-telus-gray { background-color: #54595F; }
        .border-telus-purple { border-color: #4B286D; }
        .border-telus-green { border-color: #2B8000; }
        
        /* Flat UI - No shadows or gradients */
        .tab-active {
            background-color: #4B286D;
            color: white;
            border-radius: 4px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #4B286D; }
    </style>
</head>
<body class="text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Custom Icons (SVG) ---
        const Icons = {
            Calendar: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
            ),
            Clipboard: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
            ),
            History: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            ),
            Inbox: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
            ),
            Users: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="19" cy="11" r="3"/></svg>
            ),
            FilePlus: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" x2="12" y1="18" y2="12"/><line x1="9" x2="15" y1="15" y2="15"/></svg>
            ),
            ExternalLink: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
            ),
            FileText: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
            )
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('hub');
            const [meetingData, setMeetingData] = useState({
                nextDate: "May 27, 2026",
                agenda: [
                    { id: 1, item: "Introductions", submitter: "Shane", notes: "Quick welcome and introductions" },
                    { id: 2, item: "Interlock Call Objectives", submitter: "Shane", notes: "Establish purpose and structure" },
                    { id: 3, item: "Partner Safety Interlock Hub", submitter: "Shane", notes: "Walkthrough of this portal" },
                    { id: 4, item: "Topics to Discuss", submitter: "Shane", notes: "Reviewing the current backlog" }
                ]
            });

            const [topics, setTopics] = useState([
                { id: 1, topic: "Extreme temperatures", submitter: "Shane Moews", status: "Upcoming", date: "5/8/2026" },
                { id: 2, topic: "High winds", submitter: "Shane Moews", status: "Upcoming", date: "5/8/2026" },
                { id: 3, topic: "Ladders - Type and SWPs", submitter: "Shane Moews", status: "Upcoming", date: "5/8/2026" },
                { id: 4, topic: "Working Alone", submitter: "Shane Moews", status: "Upcoming", date: "5/8/2026" },
                { id: 5, topic: "Asbestos Management", submitter: "Shane Moews", status: "Upcoming", date: "5/8/2026" },
                { id: 6, topic: "Working at night", submitter: "Shane Moews", status: "Upcoming", date: "5/8/2026" },
                //{ id: 7, topic: "Fall Protection Equipment Inspections", submitter: "Shane Moews", status: "Reviewed", date: "4/20/2026", reviewDate: "5/1/2026" },
                //{ id: 8, topic: "Tailgate Meeting Standards", submitter: "Shane Moews", status: "Reviewed", date: "4/15/2026", reviewDate: "5/1/2026" }
            ]);

            const [minutes, setMinutes] = useState([
                //{ id: 101, date: "May 1, 2026", title: "Placeholder", attendees: 9, summary: "Where future minutes will appear.", link: "#" },
                //{ id: 102, date: "April 15, 2026", title: "Quarterly Performance Review", attendees: 8, summary: "Partner performance metrics and Q3 safety goals setting.", link: "#" },
                //{ id: 103, date: "March 28, 2026", title: "Spring Hazard Awareness", attendees: 15, summary: "Focus on site prep for spring thaw and increased outdoor activity.", link: "#" },
                //{ id: 104, date: "March 10, 2026", title: "Equipment Standards Update", attendees: 10, summary: "New PPE requirements for electrical field work.", link: "#" }
            ]);

            const upcomingTopics = topics.filter(t => t.status === "Upcoming");
            const reviewedTopics = topics.filter(t => t.status === "Reviewed");

            // Dynamic Stats Calculation
            const totalTopics = topics.length;
            const closedCount = reviewedTopics.length;
            const openCount = upcomingTopics.length;
            const pace = totalTopics > 0 ? Math.round((closedCount / totalTopics) * 100) : 0;

            const renderDashboard = () => (
                <main className="grid grid-cols-1 lg:grid-cols-12 gap-10 animate-in fade-in duration-300">
                    {/* LEFT COLUMN: Agenda */}
                    <div className="lg:col-span-8">
                        <section className="bg-white border-2 border-slate-200 overflow-hidden">
                            <div className="bg-telus-purple p-8 flex items-center justify-between">
                                <h2 className="text-2xl font-black text-white flex items-center gap-4">
                                    <Icons.Clipboard />
                                    CURRENT AGENDA
                                </h2>
                                <span className="px-6 py-2 bg-white text-telus-purple text-[11px] font-black uppercase tracking-widest">
                                    {meetingData.agenda.length} Items
                                </span>
                            </div>
                            <div className="p-4">
                                {meetingData.agenda.map((item, idx) => (
                                    <div key={item.id} className="p-8 hover:bg-slate-50 transition-all group flex gap-8 border-b-2 border-slate-100 last:border-0">
                                        <div className="flex-shrink-0 w-14 h-14 bg-telus-gray text-white font-black flex items-center justify-center text-xl group-hover:bg-telus-purple">
                                            {idx + 1}
                                        </div>
                                        <div>
                                            <h3 className="font-black text-slate-800 text-2xl mb-2">{item.item}</h3>
                                            <p className="text-slate-600 text-lg leading-relaxed">{item.notes}</p>
                                            <div className="mt-4 flex items-center gap-3">
                                                <span className="text-[11px] font-black text-white bg-telus-purple px-3 py-1 uppercase tracking-widest">{item.submitter}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </div>

                    {/* RIGHT COLUMN: Action & Stats */}
                    <div className="lg:col-span-4 space-y-10">
                        <div className="bg-telus-gray p-10 text-white border-b-8 border-telus-green">
                            <h4 className="text-3xl font-black mb-6 flex flex-col gap-2">
                                <span className="text-telus-green text-sm uppercase tracking-[0.4em]">Get Involved</span>
                                SUGGEST TOPIC
                            </h4>
                            <p className="text-slate-300 text-lg mb-10 leading-relaxed font-medium">Contribute to our safety standards. Your topics drive the interlock discussions.</p>
                            <button   className="bg-telus-purple hover:bg-[#3a1f54] text-white w-full py-5 font-black transition-all active:scale-95 uppercase tracking-widest text-sm border-b-4 border-[#2d1842]"
  onClick={() => window.location.href='https://forms.gle/b41eE251JJ5sqtxy7'}>
                                Launch Form
                            </button>
                        </div>

                        <div className="bg-white border-4 border-telus-green p-10">
                            <div className="flex items-center gap-4 mb-8">
                                <div className="bg-telus-green text-white p-3"><Icons.Users /></div>
                                <h4 className="text-xs font-black text-slate-800 uppercase tracking-[0.3em]">Outstanding Topics</h4>
                            </div>
                            <div className="space-y-8">
                                <div>
                                    <div className="flex justify-between items-end mb-2">
                                        <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Reviewed</span>
                                        <span className="text-2xl font-black text-telus-green">{pace}%</span>
                                    </div>
                                    <div className="h-4 bg-slate-100 border-2 border-slate-200">
                                        <div className="bg-telus-green h-full transition-all duration-500" style={{ width: `${pace}%` }}></div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4 border-t-2 border-slate-100 pt-8">
                                    <div className="text-center">
                                        <span className="block text-[10px] font-black text-slate-400 uppercase mb-1">Reviewed</span>
                                        <span className="text-3xl font-black text-slate-800">{String(closedCount).padStart(2, '0')}</span>
                                    </div>
                                    <div className="text-center border-l-2 border-slate-100">
                                        <span className="block text-[10px] font-black text-slate-400 uppercase mb-1">Upcoming</span>
                                        <span className="text-3xl font-black text-orange-600">{String(openCount).padStart(2, '0')}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-white border-2 border-telus-gray p-8 text-center">
                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-[0.5em] mb-4">Core Sync</p>
                            <div className="inline-flex items-center gap-4 px-6 py-3 bg-telus-gray text-white font-black text-xs">
                                <span className="w-2.5 h-2.5 bg-telus-green"></span>
                                CONNECTED SECURE
                            </div>
                        </div>
                    </div>
                </main>
            );

            const renderTopics = () => (
                <section className="space-y-12 animate-in fade-in duration-300">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                        {/* Topic Backlog */}
                        <section className="bg-white border-2 border-slate-200 overflow-hidden">
                            <div className="bg-telus-green p-8 flex items-center justify-between">
                                <div className="flex items-center gap-4 text-white">
                                    <Icons.Inbox />
                                    <h3 className="text-2xl font-black uppercase tracking-widest">Backlog</h3>
                                </div>
                                <span className="px-4 py-1 bg-white text-telus-green text-[11px] font-black uppercase tracking-widest">
                                    {upcomingTopics.length} Pending
                                </span>
                            </div>
                            <div className="p-8 space-y-6">
                                {upcomingTopics.map(topic => (
                                    <div key={topic.id} className="p-6 bg-slate-50 border-2 border-slate-100 border-l-8 border-l-telus-green hover:bg-white transition-all">
                                        <p className="font-black text-slate-800 text-xl mb-3 leading-tight">{topic.topic}</p>
                                        <div className="flex justify-between items-center text-[11px] font-black text-slate-500 uppercase tracking-widest">
                                            <span>Added {topic.date}</span>
                                            <div className="flex items-center gap-2">
                                                <span className="w-2 h-2 bg-telus-green"></span>
                                                <span className="text-telus-green tracking-tighter">Awaiting Discussion</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Completed Topics */}
                        <section className="bg-white border-2 border-slate-200 overflow-hidden">
                            <div className="bg-telus-gray p-8 flex items-center justify-between">
                                <div className="flex items-center gap-4 text-white">
                                    <Icons.History />
                                    <h3 className="text-2xl font-black uppercase tracking-widest">Reviewed</h3>
                                </div>
                                <span className="px-4 py-1 bg-white text-telus-gray text-[11px] font-black uppercase tracking-widest">
                                    Archive
                                </span>
                            </div>
                            <div className="p-8 space-y-6">
                                {reviewedTopics.map(topic => (
                                    <div key={topic.id} className="p-6 bg-slate-100 border-2 border-slate-200 opacity-70">
                                        <p className="font-bold text-slate-600 line-through text-xl mb-3 leading-tight">{topic.topic}</p>
                                        <div className="flex justify-between items-center text-[11px] font-black text-slate-500 uppercase tracking-widest">
                                            <span>Interlocked on {topic.reviewDate}</span>
                                            <span className="text-slate-400">Complete</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </div>

                    <div className="bg-slate-100 p-10 border-l-8 border-telus-purple">
                        <h4 className="text-sm font-black text-telus-purple uppercase tracking-widest mb-2">Process Note</h4>
                        <p className="text-slate-600 font-medium">Items remain in the backlog until they are formally added to a session agenda. Once reviewed, they are archived here for historical reference.</p>
                    </div>
                </section>
            );

            const renderMinutes = () => (
                <section className="space-y-12 animate-in fade-in duration-300">
                    <div className="bg-telus-gray p-12 text-white flex flex-col md:flex-row md:items-center justify-between gap-8 border-b-8 border-telus-purple">
                        <div>
                            <h2 className="text-5xl font-black mb-4 uppercase tracking-tighter">The <span className="text-telus-green italic">Archive</span></h2>
                            <p className="text-slate-300 text-xl font-medium max-w-lg leading-relaxed">Historical records from every partner safety session.</p>
                        </div>
                        <div className="relative">
                            <input 
                                type="text" 
                                placeholder="SEARCH RECORDS..." 
                                className="bg-white text-slate-800 border-4 border-slate-200 py-5 pl-14 pr-8 text-sm focus:outline-none focus:border-telus-purple transition-all w-full md:w-96 font-black uppercase tracking-widest placeholder:text-slate-400"
                            />
                            <div className="absolute left-6 top-1/2 -translate-y-1/2 text-telus-purple">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                        {minutes.map(doc => (
                            <a 
                                key={doc.id} 
                                href={doc.link} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="bg-white border-4 border-slate-100 p-10 transition-colors hover:border-telus-purple"
                            >
                                <div className="bg-telus-gray text-white w-14 h-14 flex items-center justify-center mb-8">
                                    <Icons.FileText />
                                </div>
                                <p className="text-[11px] font-black text-telus-purple uppercase tracking-[0.3em] mb-3">{doc.date}</p>
                                <h3 className="text-3xl font-black text-slate-800 mb-4 tracking-tighter leading-none">{doc.title}</h3>
                                <p className="text-slate-600 mb-10 flex-grow font-medium text-lg leading-relaxed">{doc.summary}</p>
                                <div className="pt-8 border-t-4 border-slate-50 flex items-center justify-between text-[11px] font-black text-slate-400">
                                    <span className="bg-slate-100 px-3 py-1 font-black">{doc.attendees} PRESENT</span>
                                    <span className="flex items-center gap-2 text-telus-green tracking-widest font-black">OPEN PDF <Icons.ExternalLink /></span>
                                </div>
                            </a>
                        ))}
                    </div>

         
                </section>
            );

            return (
                <div className="max-w-6xl mx-auto px-6 py-12 mb-20">
                    {/* Header Section - Flat Bold Design */}
                    <header className="mb-12 flex flex-col md:flex-row md:items-center justify-between gap-8 bg-white p-10 border-b-8 border-telus-purple">
                        <div>
                            <div className="flex items-center gap-3 mb-4">
                                <span className="uppercase tracking-[0.4em] text-[36px] font-black text-slate-400">Partner Safety</span>
                            </div>
                            <h1 className="text-5xl md:text-7xl font-black text-slate-800 tracking-tighter leading-none">
                                Interlock Hub
                            </h1>
                        </div>
                        
                        <div className="bg-slate-100 p-6 flex items-center gap-6 border-2 border-slate-200">
                            <div className="bg-telus-green text-white p-4">
                                <Icons.Calendar />
                            </div>
                            <div>
                                <p className="text-[11px] uppercase font-black text-slate-500 tracking-widest mb-1">Upcoming Session</p>
                                <p className="font-black text-slate-800 text-2xl">{meetingData.nextDate}</p>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs - Added Topic Tracker */}
                    <nav className="flex gap-2 mb-12 bg-slate-200 p-2 inline-flex overflow-x-auto max-w-full">
                        <button 
                            onClick={() => setActiveTab('hub')}
                            className={`py-3 px-8 text-xs font-black tracking-[0.2em] transition-all whitespace-nowrap ${activeTab === 'hub' ? 'tab-active' : 'text-slate-600 hover:bg-slate-300'}`}
                        >
                            DASHBOARD
                        </button>
                        <button 
                            onClick={() => setActiveTab('topics')}
                            className={`py-3 px-8 text-xs font-black tracking-[0.2em] transition-all whitespace-nowrap ${activeTab === 'topics' ? 'tab-active' : 'text-slate-600 hover:bg-slate-300'}`}
                        >
                            TOPIC TRACKER
                        </button>
                        <button 
                            onClick={() => setActiveTab('minutes')}
                            className={`py-3 px-8 text-xs font-black tracking-[0.2em] transition-all whitespace-nowrap ${activeTab === 'minutes' ? 'tab-active' : 'text-slate-600 hover:bg-slate-300'}`}
                        >
                            MINUTES ARCHIVE
                        </button>
                    </nav>

                    {activeTab === 'hub' && renderDashboard()}
                    {activeTab === 'topics' && renderTopics()}
                    {activeTab === 'minutes' && renderMinutes()}

                    <footer className="text-center mt-32 text-slate-500 text-[11px] uppercase tracking-[0.6em] font-black flex items-center justify-center gap-6">
                        <span className="w-16 h-1 bg-slate-300"></span>
                        TELUS HEALTH & SAFETY
                        <span className="w-16 h-1 bg-slate-300"></span>
                    </footer>
                </div>
            );
        };

        // Render the app
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
